<!DOCTYPE html>

    <title>English Dictation Week # 27</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 40px;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        /* Gallery grid layout */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Individual card container */
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Clickable image styling */
        .clickable-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .clickable-image:hover {
            opacity: 0.9;
        }

        .clickable-image:active {
            transform: scale(0.98);
        }

        /* Action button under the image */
        .text-btn {
            margin-top: 15px;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s ease;
            width: 100%;
        }

        .text-btn:hover {
            background-color: #0056b3;
        }

        /* Hidden text description box */
        .description-box {
            display: none; /* Hidden by default */
            margin-top: 12px;
            padding: 10px;
            background-color: #e9ecef;
            border-left: 4px solid #007bff;
            width: 100%;
            box-sizing: border-box;
            font-size: 14px;
            border-radius: 4px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

    <script>
        // Track current playing audio so they don't overlap awkwardly
        let currentAudio = null;

        function playSound(audioFile) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            currentAudio = new Audio(audioFile);
            currentAudio.play().catch(error => {
                console.log("Audio playback error (make sure sound file exists):", error);
            });
        }

        function toggleText(descId) {
            var box = document.getElementById(descId);
            // Toggle visibility (if hidden show it, if showing hide it)
            if (box.style.display === "block") {
                box.style.display = "none";
            } else {
                box.style.display = "block";
            }
        }
    </script>
